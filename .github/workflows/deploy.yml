name: Deploy to GitHub Pages

on:
  push:
    branches: [2026]
  repository_dispatch:
    types: [notes-updated]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checked out side-by-side (both explicit `path`s under github.workspace)
      # so scripts/sync-notes.js finds the vault at the same ../notes relative
      # path it uses locally.
      - uses: actions/checkout@v4
        with:
          path: paramt.github.io

      - uses: actions/checkout@v4
        with:
          repository: paramt/notes
          path: notes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: paramt.github.io/package-lock.json

      - run: npm ci
        working-directory: paramt.github.io

      - run: npm run build
        working-directory: paramt.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: paramt.github.io/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
